# argon_gateway prj.conf
#
# This firmware supports two runtime-selectable, mutually exclusive radio
# modes (see src/main.c for the full picture):
#   Mode 1: BLE central/GATT-client relaying xenon_sensor's BLE telemetry
#           (CONFIG_BT and friends)
#   Mode 2: Thread/802.15.4 node listening for xenon_sensor's UDP multicast
#           telemetry (CONFIG_NET_L2_OPENTHREAD and friends)
# Both stacks are compiled into the same image (the mode choice is a
# runtime, persisted decision, not a build-time one), but only one is ever
# actually started by application code - see the
# CONFIG_BT_CTLR_DYNAMIC_INTERRUPTS note below for why that distinction
# matters even at the Kconfig level. This mirrors xenon_sensor/prj.conf,
# which established this exact dual-mode Kconfig pattern first - see that
# file for the fuller narrative behind each section below.
#
# Console correction (carried over, unchanged): an earlier version of this
# file assumed particle_argon's default UART console was fine to use as-is.
# A real hardware test proved that wrong -- zero bytes were ever captured on
# the only physically wired serial path, because the board's UART0 console
# pins aren't connected to anything on this bench setup, and this app's
# entire point is relaying JSON telemetry over USB serial.
# boards/particle_argon.overlay repoints the console at a CDC-ACM node
# riding the board's native USB port instead (the same cable already used
# for flashing/power), and the Kconfig below is what that overlay needs to
# actually work. Left as-is, no Thread-specific overlay changes needed.

# --- Bluetooth: central (GATT client) role only (Mode 1) --------------------
# This board only ever scans, connects, and reads/subscribes as a GATT
# client -- it never advertises or accepts connections, so
# CONFIG_BT_PERIPHERAL is deliberately left disabled. CONFIG_BT_CENTRAL
# implicitly selects CONFIG_BT_OBSERVER (required for scanning).
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

# The nRF52840 has a single 2.4GHz radio shared by the BLE controller and the
# 802.15.4 driver below. By default, Zephyr's BLE controller statically binds
# the shared RADIO_IRQn vector at build time (IRQ_DIRECT_CONNECT), which is
# incompatible with the 802.15.4 driver's own static IRQ_CONNECT on the same
# line once CONFIG_NET_L2_OPENTHREAD is also enabled. Dynamic interrupts are
# meant to make the BLE controller attach its RADIO_IRQn handler only when
# bt_enable() actually runs (Mode 1 only), leaving the vector genuinely free
# for the 802.15.4 driver otherwise -- see
# subsys/bluetooth/controller/Kconfig.ll_sw_split's help text for
# BT_CTLR_DYNAMIC_INTERRUPTS, which documents exactly this scenario. Getting
# that promise to actually hold at runtime (not just at build time) takes
# all *three* of the lines below; each was root-caused on real hardware via
# SWD after a Mode 2 (Thread) livelock, and each is necessary but not
# individually sufficient:
#
# 1. CONFIG_DYNAMIC_INTERRUPTS -- the general kernel prerequisite for any
#    dynamic IRQ attachment at all.
#
# 2. CONFIG_BT_CTLR_ADVANCED_FEATURES -- easy to miss: BT_CTLR_DYNAMIC_
#    INTERRUPTS lives inside `menu "Advanced features" / visible if
#    BT_CTLR_ADVANCED_FEATURES` in Kconfig.ll_sw_split. A menu's "visible
#    if" doesn't just hide the prompt in menuconfig -- it makes the child
#    symbol's prompt invisible outright, and Kconfig silently drops any
#    `CONFIG_BT_CTLR_DYNAMIC_INTERRUPTS=y` assignment for a symbol with no
#    visible prompt, falling back to its default (n). Without this line,
#    setting BT_CTLR_DYNAMIC_INTERRUPTS=y below was a complete no-op --
#    confirmed by grepping the generated .config, where the symbol was
#    entirely absent (not even "# ... is not set") until this line was
#    added.
#
# 3. CONFIG_BT_CTLR_DYNAMIC_INTERRUPTS -- and even with (2) making it
#    actually take effect, it alone only covers the controller's RTC0/SWI
#    lines via the truly dynamic irq_connect_dynamic() path
#    (ll_sw/nordic/lll/lll.c:304-311, unconditional). The RADIO_IRQn (and
#    TIMER0_IRQn) line specifically only goes through irq_connect_dynamic()
#    when CONFIG_DYNAMIC_DIRECT_INTERRUPTS (below) is *also* set; otherwise
#    lll_init() falls through to a plain, build-time
#    IRQ_DIRECT_CONNECT(HAL_RADIO_IRQn, ..., radio_nrf5_isr, ...)
#    (lll.c:296-298).
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_DYNAMIC_INTERRUPTS=y

# Without this, IRQ_DIRECT_CONNECT's underlying Z_ISR_DECLARE_DIRECT macro
# (include/zephyr/arch/arm/irq.h:156-163; comment at :137-146 says outright
# "This is all done at build-time") burns radio_nrf5_isr straight into the
# real hardware vector table for RADIO_IRQn at LINK time -- via lll_init()'s
# code being reachable (and thus never dead-stripped) through the
# always-instantiated Bluetooth HCI driver device -- regardless of whether
# lll_init() (and therefore bt_enable()) is ever actually *called* at
# runtime. Verified directly against the compiled output: with only the
# BT_CTLR_DYNAMIC_INTERRUPTS fix above and this line still missing,
# zephyr/isr_tables.c's `_irq_vector_table[1]` (RADIO_IRQn on this SoC)
# resolved via `nm zephyr.elf` straight to radio_nrf5_isr; with this line
# added, that same slot resolves to the generic
# z_arm_irq_direct_dynamic_dispatch_no_reschedule stub
# (arch/arm/core/cortex_m/irq_manage.c) instead, which looks up the real
# handler from _sw_isr_table[1] *at runtime*. That software-table slot's
# build-time default is drivers/ieee802154/ieee802154_nrf5.c's own
# nrf5_radio_irq (its nrf5_irq_config() runs unconditionally at POST_KERNEL
# boot via NET_DEVICE_DT_INST_DEFINE, regardless of mode, and does a plain,
# non-direct IRQ_CONNECT that gen_isr_tables_parser_carrays.py never
# cross-checks against BT's direct claim on the same IRQ number -- so the
# conflict built clean and only manifested as a runtime livelock). Only
# irq_connect_dynamic(HAL_RADIO_IRQn, ..., radio_nrf5_isr, ...) -- reached
# solely via lll_init(), solely via bt_enable(), solely in Mode 1 -- ever
# overwrites that slot. In Mode 2, since bt_enable() is never called, the
# 802.15.4 driver's own registration is left standing and RADIO_IRQn
# dispatches to it exclusively; BT's radio code genuinely never runs.
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y

# --- Thread / 802.15.4 node (Mode 2) -----------------------------------------
# NET_L2_OPENTHREAD pulls in CONFIG_OPENTHREAD, CONFIG_NET_L2_PHY_IEEE802154
# and (via "imply") CONFIG_NET_UDP/CONFIG_NET_IPV6; they're still listed
# explicitly below since this app calls the socket API directly.
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV6=y

# Multicast Listener Discovery support. Defaults to y upstream, but made
# explicit here since this app's whole Mode 2 purpose depends on it:
# net_ipv6_mld_join() (invoked internally via the ZSOCK_IPV6_ADD_MEMBERSHIP
# setsockopt() this app calls in thread_join_multicast_group()) is a stub
# returning -ENOTSUP when this is off. See include/zephyr/net/mld.h.
CONFIG_NET_IPV6_MLD=y

# Keep the Thread network administratively down until application code
# explicitly calls openthread_run() (see thread_mode_start() in main.c).
# Without this, OpenThread auto-joins the network as soon as the network
# interface comes up at boot - regardless of which mode is persisted - which
# would violate the "only one stack is ever actually running" design.
CONFIG_OPENTHREAD_MANUAL_START=y

# NOT A SECRET - safe to be public. Must match xenon_sensor/prj.conf's Mode 2
# credentials byte-for-byte -- this gateway has to join the exact same
# Thread network xenon_sensor's Mode 2 forms/joins, or it will never see the
# multicast telemetry at all. Copied verbatim from xenon_sensor/prj.conf; see
# that file for the full rationale behind these specific placeholder values.
#   PAN ID:            0xFEED (65261)
#   Extended PAN ID:    58:45:4e:4f:4e:00:00:01
#   Network key:        de:ad:be:ef:ca:fe:f0:0d:13:37:c0:de:00:01:02:03
#   Channel:            15 (2425 MHz)
#   Network name:       XenonMesh
CONFIG_OPENTHREAD_PANID=65261
CONFIG_OPENTHREAD_XPANID="58:45:4e:4f:4e:00:00:01"
CONFIG_OPENTHREAD_NETWORKKEY="de:ad:be:ef:ca:fe:f0:0d:13:37:c0:de:00:01:02:03"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORK_NAME="XenonMesh"

# --- Persisted mode storage (both modes) -------------------------------------
# A single uint8_t (0=BLE, 1=Thread) is stored in the board's existing
# "storage_partition" flash partition (defined upstream in
# nordic/nrf52840_partition.dtsi, already included by this board's devicetree
# via mesh_feather.dtsi - no overlay needed) using the NVS key-value store.
CONFIG_FLASH=y
CONFIG_NVS=y
CONFIG_REBOOT=y

# --- MODE button (both modes) ------------------------------------------------
# Polled once at boot (see mode_button_is_held() in main.c) to decide whether
# to advance to the next mode. Already the board default via
# particle_argon_defconfig, but listed here since this app now depends on it
# directly.
CONFIG_GPIO=y

# --- Logging -----------------------------------------------------------
# LOG_INF breadcrumbs for scan/connect/discover/subscribe/notify flow (Mode
# 1) and network join/multicast-join/receive flow (Mode 2).
CONFIG_LOG=y

# --- printk() floating-point formatting ---------------------------------
# The telemetry JSON line prints temp_c with "%.2f". Zephyr's printk/cbprintf
# formatter drops floating-point conversions unless this is enabled, so it's
# a genuine (not incidental) requirement of this app's serial output format.
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Native USB-CDC console -------------------------------------------------
# Pairs with boards/particle_argon.overlay's cdc_acm_uart0 node. Uses the
# current (non-deprecated) USB device stack, confirmed against this exact
# Zephyr checkout's own samples/subsys/usb/console reference sample rather
# than the older CONFIG_USB_DEVICE_STACK/CONFIG_USB_CDC_ACM pair, which is
# now marked DEPRECATED in this tree.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Argon Gateway Console"

# Console logging visibility, known limitation: ground-truth confirmed via
# SWD (a temporary marker variable read directly from RAM, independent of
# any serial/USB path -- since removed) that the firmware itself boots,
# initializes Bluetooth, and starts scanning correctly every single time --
# but on real hardware, most LOG_INF output during the bt_enable() burst
# never reaches the serial console, consistently cutting off at the same
# point regardless of deferred vs. immediate logging mode or ring/UART
# buffer sizes (all tried; the UART backend buffer bump below is kept since
# it's harmless, the others weren't since they made no difference). Current
# best explanation is a USB-CDC bulk-endpoint partial-packet flush quirk in
# this Zephyr dev snapshot's native USB stack, not a bug in this app's logic
# -- ongoing low-rate output (like the actual telemetry JSON stream, one
# line per notification/datagram rather than a boot-time burst) is expected
# to reach the console reliably since it isn't a one-time burst against a
# stuck partial buffer. See docs/ for the full verification writeup.
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=256

# --- Stack sizing ------------------------------------------------------
# Bumped from the defaults to comfortably cover NVS + socket + OpenThread API
# calls made from main() and the Thread receive thread (Mode 1's BLE-only
# path needed less, but the same image now also has to cover Mode 2).
CONFIG_MAIN_STACK_SIZE=2560
