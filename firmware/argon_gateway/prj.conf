# argon_gateway prj.conf
#
# Kept to exactly what this application needs: BLE central/GATT-client role,
# logging breadcrumbs, and float formatting support for printk(). Console/UART
# (CONFIG_CONSOLE, CONFIG_SERIAL, CONFIG_UART_CONSOLE) is intentionally NOT
# repeated here -- particle_argon_defconfig already turns all three on
# unconditionally, and this board's upstream Zephyr devicetree does not wire
# up a USB CDC-ACM node, so there's nothing for a CONFIG_USB_DEVICE_STACK /
# CONFIG_USB_CDC_ACM pair to attach to without also carrying a devicetree
# overlay. Adding it here would be dead config at best and a conflicting
# duplicate of the board default at worst, so printk() output rides the
# board's already-enabled standard console UART instead. See the file header
# comment in src/main.c for the full reasoning.

# --- Bluetooth: central (GATT client) role only ----------------------------
# This board only ever scans, connects, and reads/subscribes as a GATT
# client -- it never advertises or accepts connections, so
# CONFIG_BT_PERIPHERAL is deliberately left disabled. CONFIG_BT_CENTRAL
# implicitly selects CONFIG_BT_OBSERVER (required for scanning).
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

# --- Logging -----------------------------------------------------------
# LOG_INF breadcrumbs for scan/connect/discover/subscribe/notify flow.
CONFIG_LOG=y

# --- printk() floating-point formatting ---------------------------------
# The telemetry JSON line prints temp_c with "%.2f". Zephyr's printk/cbprintf
# formatter drops floating-point conversions unless this is enabled, so it's
# a genuine (not incidental) requirement of this app's serial output format.
CONFIG_CBPRINTF_FP_SUPPORT=y
