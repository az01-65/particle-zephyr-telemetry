# xenon_sensor - Zephyr application config for the particle_xenon (nRF52840)
#
# Only the Kconfig symbols this application actually exercises are listed
# below; nothing here is boilerplate padding.
#
# This firmware supports two runtime-selectable, mutually exclusive radio
# modes (see src/main.c for the full picture):
#   Mode 1: BLE peripheral (CONFIG_BT and friends)
#   Mode 2: Thread/802.15.4 node sending UDP telemetry (CONFIG_NET_L2_OPENTHREAD
#           and friends)
# Both stacks are compiled into the same image (the mode choice is a runtime,
# persisted decision, not a build-time one), but only one is ever actually
# started by application code - see the CONFIG_BT_CTLR_DYNAMIC_INTERRUPTS
# note below for why that distinction matters even at the Kconfig level.

# --- Bluetooth LE peripheral (Mode 1) ---------------------------------------
# We are a GATT server that advertises and accepts a single central
# connection. No SoftDevice is used: Zephyr drives Nordic's radio directly
# through its own open-source Link Layer controller.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XenonSensor"

# The nRF52840 has a single 2.4GHz radio shared by the BLE controller and the
# 802.15.4 driver below. By default, Zephyr's BLE controller statically binds
# the shared RADIO_IRQn vector at build time (IRQ_DIRECT_CONNECT), which is
# incompatible with the 802.15.4 driver's own static IRQ_CONNECT on the same
# line once CONFIG_NET_L2_OPENTHREAD is also enabled - that combination fails
# at build time, not just at runtime. Dynamic interrupts make the BLE
# controller attach its RADIO_IRQn handler only when bt_enable() actually
# runs (Mode 1 only), leaving the vector free for the 802.15.4 driver
# otherwise. See subsys/bluetooth/controller/Kconfig.ll_sw_split's help text
# for BT_CTLR_DYNAMIC_INTERRUPTS, which documents exactly this scenario.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_DYNAMIC_INTERRUPTS=y

# All three lines above are required, not just the two originally here --
# CONFIG_BT_CTLR_DYNAMIC_INTERRUPTS lives inside a Kconfig `menu "Advanced
# features" / visible if BT_CTLR_ADVANCED_FEATURES` block
# (subsys/bluetooth/controller/Kconfig.ll_sw_split), so without
# BT_CTLR_ADVANCED_FEATURES=y its prompt is invisible and Kconfig silently
# drops the `=y` assignment -- confirmed missing entirely from the generated
# .config until this line was added. And even once genuinely enabled,
# BT_CTLR_DYNAMIC_INTERRUPTS alone only covers the controller's RTC0/SWI
# lines; RADIO_IRQn (and TIMER0_IRQn) additionally need
# CONFIG_DYNAMIC_DIRECT_INTERRUPTS below, or lll_init() falls back to a
# plain, build-time IRQ_DIRECT_CONNECT(HAL_RADIO_IRQn, ..., radio_nrf5_isr,
# ...) (subsys/bluetooth/controller/ll_sw/nordic/lll/lll.c:296-298), which
# burns radio_nrf5_isr straight into the hardware vector table at link time
# regardless of whether bt_enable() is ever called -- root-caused via SWD on
# argon_gateway as a genuine Mode 2 (Thread) livelock in radio_nrf5_isr /
# radio_has_disabled once the 802.15.4 driver's own unconditional boot-time
# IRQ_CONNECT+irq_enable(RADIO_IRQn) (drivers/ieee802154/ieee802154_nrf5.c)
# starts real radio activity on the same shared IRQ line, and verified by
# resolving the generated isr_tables.c vector-table address against
# zephyr.elf's symbol table before and after the fix. See argon_gateway/
# prj.conf's copy of this comment for the full mechanism writeup; this app
# has the identical dual-mode BLE/Thread pattern and needs the identical fix.
CONFIG_DYNAMIC_DIRECT_INTERRUPTS=y

# --- Thread / 802.15.4 node (Mode 2) -----------------------------------------
# NET_L2_OPENTHREAD pulls in CONFIG_OPENTHREAD, CONFIG_NET_L2_PHY_IEEE802154
# and (via "imply") CONFIG_NET_UDP/CONFIG_NET_IPV6; they're still listed
# explicitly below since this app calls the socket API directly.
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV6=y

# MTD (Minimal Thread Device), not the FTD default - a Xenon sensor node
# only ever needs to attach as a Child and send its own telemetry; it never
# needs to relay other nodes' mesh traffic. This is a real architectural
# choice, not just a naming detail: OPENTHREAD_DEVICE_TYPE is a Kconfig
# choice (modules/openthread/Kconfig.thread) between OPENTHREAD_FTD (can
# become Router or Leader) and OPENTHREAD_MTD (attaches as Child only -
# structurally incapable of self-promoting to Router/Leader). Confirmed on
# real hardware that leaving this at the FTD default let a Xenon and the
# Argon each independently self-promote to Leader of their own separate
# partition before ever hearing each other, splitting the mesh even though
# all nodes shared identical network credentials - MTD here closes off that
# entire failure class for Xenon nodes rather than just working around one
# instance of it. argon_gateway deliberately stays FTD/Leader-eligible,
# since something needs to be able to form the network in the first place.
CONFIG_OPENTHREAD_MTD=y

# Keep the Thread network administratively down until application code
# explicitly calls openthread_run() (see thread_mode_start() in main.c).
# Without this, OpenThread auto-joins the network as soon as the network
# interface comes up at boot - regardless of which mode is persisted - which
# would violate the "only one stack is ever actually running" design.
CONFIG_OPENTHREAD_MANUAL_START=y

# NOT A SECRET - safe to be public. Hardcoded demo network credentials so
# the node can auto-join without a real commissioning flow (out of scope for
# this demo per the design brief). The network key below is deliberately
# constructed from leet-speak hex words (deadbeef cafe f00d 1337 code) so it
# reads unambiguously as a placeholder, not real security material - it
# protects nothing beyond this local demo network, which has no border
# router/gateway listener built yet anyway (see thread_mode_start() in
# main.c). A real product would generate a unique key per deployment through
# proper Thread commissioning; this fixed value exists purely so this repo's
# firmware is immediately joinable for anyone testing it, matching the
# project's "clone and flash, no setup" design goal. Document these clearly -
# a border router or sniffer needs them to see this network:
#   PAN ID:            0xFEED (65261)
#   Extended PAN ID:    58:45:4e:4f:4e:00:00:01
#   Network key:        de:ad:be:ef:ca:fe:f0:0d:13:37:c0:de:00:01:02:03
#   Channel:            15 (2425 MHz)
#   Network name:       XenonMesh
CONFIG_OPENTHREAD_PANID=65261
CONFIG_OPENTHREAD_XPANID="58:45:4e:4f:4e:00:00:01"
CONFIG_OPENTHREAD_NETWORKKEY="de:ad:be:ef:ca:fe:f0:0d:13:37:c0:de:00:01:02:03"
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_NETWORK_NAME="XenonMesh"

# --- Persisted mode storage (both modes) -------------------------------------
# A single uint8_t (0=BLE, 1=Thread) is stored in the board's existing
# "storage_partition" flash partition (defined upstream in
# nordic/nrf52840_partition.dtsi, already included by this board's devicetree
# - no overlay needed) using the NVS key-value store.
CONFIG_FLASH=y
CONFIG_NVS=y
CONFIG_REBOOT=y

# --- MODE button (both modes) ------------------------------------------------
# Polled once at boot (see mode_button_is_held() in main.c) to decide whether
# to advance to the next mode. Already the board default via
# particle_xenon_defconfig, but listed here since this app now depends on it
# directly.
CONFIG_GPIO=y

# --- Sensors -----------------------------------------------------------
# On-chip die temperature via the standard Zephyr sensor API.
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y

# SAADC (successive-approximation ADC) driver, used for VDD rail sensing
# via the internal NRF_SAADC_VDD pseudo-channel.
CONFIG_ADC=y

# --- Logging -------------------------------------------------------------
# Console breadcrumbs so a human watching the serial port can confirm the
# sampling thread and the active mode's stack are both alive and doing the
# right thing.
CONFIG_LOG=y

# --- Native USB-CDC console -------------------------------------------------
# particle_xenon shares particle_argon's default zephyr,console = &uart0,
# which has nothing physically wired to it on this bench setup (root-caused
# for argon_gateway; see that app's prj.conf for the full writeup). Pairs
# with boards/particle_xenon.overlay's cdc_acm_uart0 node. Uses the current
# (non-deprecated) USB device stack, confirmed against this exact Zephyr
# checkout's own samples/subsys/usb/console reference sample.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Xenon Sensor Console"

# Known limitation carried over from argon_gateway: most LOG_INF output
# during a burst of radio-stack init messages may not reach the console
# (root-caused via SWD ground-truth there, not a functional bug -- see that
# app's prj.conf). This buffer bump is harmless and kept for the same reason.
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=256

# --- Stack sizing ------------------------------------------------------
# Bumped from the defaults to comfortably cover NVS + socket + OpenThread API
# calls made from main() and the sampling thread (Mode 1's BLE-only path
# needed less, but the same image now also has to cover Mode 2).
CONFIG_MAIN_STACK_SIZE=2560
