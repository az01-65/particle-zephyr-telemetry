# esp32_passthrough - turns the Particle Argon's nRF52840 into a transparent
# USB<->UART bridge to its own onboard ESP32 Wi-Fi co-processor, plus the
# GPIO0/EN control needed for esptool.py/Arduino IDE's normal auto-reset
# flashing sequence to work unmodified - so the ESP32 can be used exactly
# like any normal, directly-USB-attached ESP32 dev board.
#
# This is a separate, standalone firmware image from argon_gateway - flashing
# this REPLACES whatever's currently on the Argon's nRF52840. It has no dual
# mode, no NVS-persisted state, and no relationship to the mesh project other
# than running on the same physical board. Flash argon_gateway back onto the
# nRF52840 to return the Argon to the mesh demo.

# --- USB device + CDC-ACM ---------------------------------------------------
# Manual USBD bring-up (see usbd_bringup() in src/main.c), not the simpler
# Kconfig-only auto-init this project's other two apps use - this app needs
# to register a message callback for CDC_ACM_CONTROL_LINE_STATE/LINE_CODING
# events (to drive the ESP32's reset sequence and keep uart1's baud rate in
# sync), which the auto-init path has no hook for.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Needed to read the host's DTR/RTS state (uart_line_ctrl_get()) and to let
# uart_bridge_settings_update() apply the host's chosen baud rate to uart1.
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# --- ESP32 UART bridge -------------------------------------------------------
# CONFIG_UART_BRIDGE itself is not set here - it self-selects (see
# drivers/serial/Kconfig.bridge: `depends on DT_HAS_ZEPHYR_UART_BRIDGE_ENABLED`)
# once boards/particle_argon.overlay's zephyr,uart-bridge node exists. That
# in turn selects CONFIG_UART_INTERRUPT_DRIVEN and CONFIG_RING_BUFFER, which
# is what actually does the byte-for-byte USB<->UART pumping - not
# reimplemented in this app. CONFIG_SERIAL/CONFIG_GPIO below are this app's
# own direct requirements (uart_line_ctrl_get() and the ESPBOOT/ESPEN pins).
CONFIG_SERIAL=y
CONFIG_GPIO=y

# The bridge driver's default ring buffer (256 bytes each direction) is too
# small for this link: esptool.py's ROM/stub-upload protocol sends chunks of
# several hundred to a few thousand bytes in a single burst, over full-speed
# USB, into a UART side capped at 921600 baud at best. Neither side of this
# bridge has real hardware flow control (uart1 to the ESP32 is TX/RX only -
# see boards/particle_argon.overlay), so the driver's only backpressure is
# disabling its own RX interrupt when its ring buffer is nearly full - which
# does not, and cannot, tell the sender to actually stop sending. Whatever
# arrives while paused is simply lost at the hardware FIFO level. Confirmed
# on real hardware: esptool uploads reliably synced and read registers fine
# (small exchanges) but reproducibly died mid-transfer during the stub
# upload/flash steps (large bursts), with "Invalid head of packet" or "chip
# stopped responding" - exactly this failure mode. Sizing the buffer to
# comfortably exceed the largest single burst either side sends removes the
# need for that backpressure to ever trigger during a normal upload.
CONFIG_UART_BRIDGE_BUF_SIZE=8192

# --- Logging -----------------------------------------------------------------
# Console is deliberately left at the board's own default (&uart0, physically
# unwired here - see boards/particle_argon.overlay) rather than repointed to
# cdc_acm_uart0 the way this project's other two apps do it: that port is
# fully owned by the raw ESP32 flashing traffic here, and log output landing
# on the same wire would corrupt it.
CONFIG_LOG=y
