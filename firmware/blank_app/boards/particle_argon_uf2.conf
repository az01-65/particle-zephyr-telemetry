# blank_app EXTRA Kconfig fragment - UF2/bootloader-safe build variant.
#
# Companion to boards/particle_argon_uf2.overlay, applied together via
# -DEXTRA_CONF_FILE alongside -DEXTRA_DTC_OVERLAY_FILE. The devicetree
# overlay alone is NOT enough to relocate the link address: Zephyr only
# links the app into its devicetree zephyr,code-partition when
# CONFIG_USE_DT_CODE_PARTITION is on, and that Kconfig option defaults to
# off on this SoC (confirmed by inspecting the plain overlay-only build's
# own .config and generated zephyr.hex, which still start at 0x0 even
# with the code_partition node present - and by reproducing the same
# default-off behavior on Zephyr's own upstream reference board for this
# exact scenario, adafruit_feather_nrf52840/nrf52840/uf2). Without this,
# the overlay's new partition would sit unused in the devicetree and the
# build would silently keep linking at 0x0 - exactly the failure mode
# Bug 1 is about, just moved one layer deeper.
CONFIG_USE_DT_CODE_PARTITION=y
